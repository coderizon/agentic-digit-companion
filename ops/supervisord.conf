[unix_http_server]
file=%(ENV_FREIBURG_ROOT)s/run/supervisor.sock
chmod=0600

[supervisord]
pidfile=%(ENV_FREIBURG_ROOT)s/run/supervisord.pid
logfile=%(ENV_FREIBURG_ROOT)s/logs/supervisord.log
childlogdir=%(ENV_FREIBURG_ROOT)s/logs
directory=%(ENV_FREIBURG_ROOT)s
umask=077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_FREIBURG_ROOT)s/run/supervisor.sock

[program:reader]
command=/bin/bash "%(ENV_FREIBURG_ROOT)s/ops/run.sh" reader
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=%(ENV_FREIBURG_ROOT)s/logs/reader.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

[program:search]
command=/bin/bash "%(ENV_FREIBURG_ROOT)s/ops/run.sh" search
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_FREIBURG_ROOT)s/logs/search.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

[program:gateway]
command=/bin/bash "%(ENV_FREIBURG_ROOT)s/ops/run.sh" gateway
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_FREIBURG_ROOT)s/logs/gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

[program:webui]
command=/bin/bash "%(ENV_FREIBURG_ROOT)s/ops/run.sh" webui
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_FREIBURG_ROOT)s/logs/webui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
